name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff==0.12.9

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest-cov==7.1.0

      - name: Unit tests (STING)
        run: python -m pytest tests -q --cov=src --cov-report=term

      - name: Dataset compliance check
        run: python scripts/data/check_data.py

  midterm-replay:
    name: Midterm ZIP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the ZIP's pinned dependencies
        run: |
          python -X utf8 -c "from pathlib import Path; from zipfile import ZipFile; p = Path('submissions/Nhom15_GiuaKy_STING_PAPI.zip'); z = ZipFile(p); Path('midterm-requirements.txt').write_bytes(z.read(p.stem + '/requirements.txt')); z.close()"
          python -m pip install -r midterm-requirements.txt

      - name: Replay both notebooks from the extracted ZIP
        run: python -X utf8 scripts/deliverables/build_submission_packages.py --verify --milestone midterm

      - name: Print notebook logs if replay failed
        if: failure()
        run: python -X utf8 -c "from pathlib import Path; [print(p.name, p.read_text(encoding='utf-8')) for p in Path('submissions').glob('replay-midterm*.log')]"
